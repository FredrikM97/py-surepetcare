repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run --extra dev ruff check --fix
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff format
        entry: uv run --extra dev ruff format
        language: system
        pass_filenames: false
        always_run: true

      - id: mypy
        name: mypy
        entry: uv run --extra dev --extra cli python -m mypy
        args: [surepcio, surepccli, tests]
        language: system
        pass_filenames: false
        always_run: true