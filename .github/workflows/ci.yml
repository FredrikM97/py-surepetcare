name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Run pre-commit on changed files (PR)
        if: github.event_name == 'pull_request'
        run: uv tool run --from pre-commit pre-commit run --show-diff-on-failure --color=always --from-ref origin/${{ github.base_ref }} --to-ref HEAD
      - name: Run pre-commit on all files (push to main)
        if: github.event_name == 'push'
        run: uv tool run --from pre-commit pre-commit run --show-diff-on-failure --color=always --all-files

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: |
          uv sync --all-extras --dev --frozen
      - name: Verify lock file is up to date
        run: |
          uv lock --check
      - name: Audit locked dependencies
        run: |
          uv export --frozen --all-extras --format requirements-txt --no-hashes -o requirements.lock.txt
          uv tool run --from pip-audit pip-audit -r requirements.lock.txt
      - name: Run tests with coverage
        run: |
          uv run pytest --cov=surepcio --cov=surepccli --cov-branch --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
